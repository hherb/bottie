[package]
name = "bottie"
version = "0.9.0"
description = "A local-first, provider-flexible desktop chatbot with persistent memory."
license = "MIT"
edition = "2024"
default-run = "bottie"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bottie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bottie"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "bottie-updater-evidence"
path = "src/updater_evidence.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
dom_query = "0.27"
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "4.1", features = ["v1"] }
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
tauri-plugin-dialog = "2"
infer = "0.19"
sha2 = "0.10"
lopdf = { version = "0.44", default-features = false }
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastembed = { version = "6", default-features = false, features = [
  "hf-hub-rustls-tls",
  "ort-download-binaries-rustls-tls",
] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
sqlite-vec = "=0.1.7-alpha.10"
semver = "1"
minisign-verify = "0.2.5"
cpal = "0.18.2"
whisper-rs = "=0.16.0"
tts = "=0.26.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "=2.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", features = ["io-util", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
tokio = { version = "1", features = ["io-util", "process"] }
