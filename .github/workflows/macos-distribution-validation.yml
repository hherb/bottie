name: macOS distribution validation

on:
  workflow_dispatch:
    inputs:
      python_provenance_run_id:
        description: Prior successful Python runtime provenance run ID; leave blank for the standard distribution
        required: false
        type: string
  workflow_call:
    inputs:
      python_provenance_run_id:
        description: Prior successful Python runtime provenance run ID
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  sign-notarize-and-verify:
    name: Developer ID, notarization, and Gatekeeper
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-distribution

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify credential-free distribution contracts
        run: |
          node --check scripts/macos-distribution.mjs
          npm test -- scripts/macos-distribution.test.mjs scripts/macos-shipping-python-containment.test.mjs \
            scripts/python-protected-package.test.mjs

      - name: Validate the selected Python provenance run
        if: inputs.python_provenance_run_id != ''
        env:
          BOTTIE_PYTHON_PROVENANCE_RUN_ID: ${{ inputs.python_provenance_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$BOTTIE_PYTHON_PROVENANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The Python provenance run ID must be a positive integer." >&2
            exit 1
          fi
          run_record="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOTTIE_PYTHON_PROVENANCE_RUN_ID"
          )"
          if ! jq -e --arg source "$GITHUB_SHA" \
            '.name == "Python runtime provenance" and .head_sha == $source and .conclusion == "success"' \
            <<<"$run_record" >/dev/null; then
            echo "The selected run is not successful Python provenance for this exact source revision." >&2
            exit 1
          fi

      - name: Download the accepted Python runtime
        if: inputs.python_provenance_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottie-python-runtime-provenance
          path: package/python-provenance
          run-id: ${{ inputs.python_provenance_run_id }}
          github-token: ${{ github.token }}

      - name: Download the accepted Python candidate
        if: inputs.python_provenance_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottie-python-release-candidate-evidence
          path: package/python-protected-input
          run-id: ${{ inputs.python_provenance_run_id }}
          github-token: ${{ github.token }}

      - name: Download the accepted protected Python inspection
        if: inputs.python_provenance_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottie-python-macos-protected-inspection
          path: package/python-protected-input
          run-id: ${{ inputs.python_provenance_run_id }}
          github-token: ${{ github.token }}

      - name: Recreate the accepted protected Python app
        if: inputs.python_provenance_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path python-runner/Cargo.toml --release --locked
          target="$(rustc --print host-tuple)"
          node scripts/python-runtime-bundle.mjs \
            --prepare "$target" package/python-provenance/runtime \
            python-runner/target/release/bottie-python-runner package/python-development
          npm run --silent python:protected:macos:produce -- \
            "$GITHUB_SHA" package/python-protected-input/python-release-candidate-evidence.json \
            package/python-protected-input/macos-rebuilt.json
          cmp package/python-protected-input/macos.json package/python-protected-input/macos-rebuilt.json

      - name: Verify protected Apple credential presence
        env:
          BOTTIE_APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.BOTTIE_APPLE_DEVELOPER_ID_P12_BASE64 }}
          BOTTIE_APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.BOTTIE_APPLE_DEVELOPER_ID_P12_PASSWORD }}
          BOTTIE_APPLE_NOTARY_KEY_P8: ${{ secrets.BOTTIE_APPLE_NOTARY_KEY_P8 }}
          BOTTIE_APPLE_NOTARY_KEY_ID: ${{ secrets.BOTTIE_APPLE_NOTARY_KEY_ID }}
          BOTTIE_APPLE_NOTARY_ISSUER_ID: ${{ secrets.BOTTIE_APPLE_NOTARY_ISSUER_ID }}
          BOTTIE_CI_KEYCHAIN_PASSWORD: ${{ secrets.BOTTIE_CI_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$BOTTIE_APPLE_DEVELOPER_ID_P12_BASE64" || \
                -z "$BOTTIE_APPLE_DEVELOPER_ID_P12_PASSWORD" || \
                -z "$BOTTIE_APPLE_NOTARY_KEY_P8" || \
                -z "$BOTTIE_APPLE_NOTARY_KEY_ID" || \
                -z "$BOTTIE_APPLE_NOTARY_ISSUER_ID" || \
                -z "$BOTTIE_CI_KEYCHAIN_PASSWORD" ]]; then
            echo "Protected Apple distribution credentials are incomplete." >&2
            exit 1
          fi

      - name: Import protected Apple credentials
        env:
          BOTTIE_APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.BOTTIE_APPLE_DEVELOPER_ID_P12_BASE64 }}
          BOTTIE_APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.BOTTIE_APPLE_DEVELOPER_ID_P12_PASSWORD }}
          BOTTIE_APPLE_NOTARY_KEY_P8: ${{ secrets.BOTTIE_APPLE_NOTARY_KEY_P8 }}
          BOTTIE_CI_KEYCHAIN_PASSWORD: ${{ secrets.BOTTIE_CI_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/bottie-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bottie-signing.keychain-db"
          NOTARY_KEY_PATH="$RUNNER_TEMP/bottie-notary-key.p8"
          printf '%s' "$BOTTIE_APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BOTTIE_APPLE_NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
          security create-keychain -p "$BOTTIE_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$BOTTIE_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$BOTTIE_APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$BOTTIE_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "BOTTIE_CI_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and verify
        if: inputs.python_provenance_run_id == ''
        env:
          BOTTIE_APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/bottie-notary-key.p8
          BOTTIE_APPLE_NOTARY_KEY_ID: ${{ secrets.BOTTIE_APPLE_NOTARY_KEY_ID }}
          BOTTIE_APPLE_NOTARY_ISSUER_ID: ${{ secrets.BOTTIE_APPLE_NOTARY_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BOTTIE_UPDATER_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BOTTIE_UPDATER_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run package:macos:distribution

      - name: Sign and verify the protected Python app
        if: inputs.python_provenance_run_id != ''
        env:
          BOTTIE_APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/bottie-notary-key.p8
          BOTTIE_APPLE_NOTARY_KEY_ID: ${{ secrets.BOTTIE_APPLE_NOTARY_KEY_ID }}
          BOTTIE_APPLE_NOTARY_ISSUER_ID: ${{ secrets.BOTTIE_APPLE_NOTARY_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BOTTIE_UPDATER_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BOTTIE_UPDATER_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          npm run --silent package:macos:distribution:python --
          "$GITHUB_SHA" package/python-protected-input/python-release-candidate-evidence.json
          package/python-protected-input/macos.json package/python-protected-evidence/macos-signed.json

      - name: Prove final protected Python containment
        if: inputs.python_provenance_run_id != ''
        run: |
          npm run --silent python:protected:macos:prove-shipping -- \
            "$GITHUB_SHA" src-tauri/target/release/bundle/macos/bottie.app \
            package/python-protected-evidence/macos-signed.json \
            package/python-protected-evidence/macos-containment.json
          npm run --silent python:protected:compare -- \
            "$GITHUB_SHA" macos package/python-protected-input/python-release-candidate-evidence.json \
            package/python-protected-evidence/macos-signed.json \
            package/python-protected-evidence/macos-containment.json \
            package/python-protected-evidence/macos-accepted.json

      - name: Upload identity-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: bottie-macos-distribution-evidence
          path: package/macos-distribution-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload short-lived updater release bytes
        uses: actions/upload-artifact@v4
        with:
          name: bottie-updater-macos
          path: package/updater-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload identity-free protected Python evidence
        if: inputs.python_provenance_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: bottie-python-macos-protected-distribution-evidence
          path: |
            package/python-protected-evidence/macos-signed.json
            package/python-protected-evidence/macos-containment.json
            package/python-protected-evidence/macos-accepted.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the accepted protected Python comparison
        if: inputs.python_provenance_run_id != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bottie-python-macos-protected-comparison
          path: package/python-protected-evidence/macos-accepted.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove imported Apple credentials
        if: always()
        run: |
          if [[ -n "${BOTTIE_CI_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$BOTTIE_CI_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/bottie-developer-id.p12" "$RUNNER_TEMP/bottie-notary-key.p8"
          rm -rf package/updater-artifacts
          rm -rf package/python-development package/python-protected package/python-protected-input
