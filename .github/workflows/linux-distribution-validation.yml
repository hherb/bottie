name: Linux distribution validation

on:
  workflow_dispatch:
    inputs:
      python_provenance_run_id:
        description: Prior successful Python runtime provenance run ID; leave blank for the standard distribution
        required: false
        type: string
  workflow_call:
    inputs:
      python_provenance_run_id:
        description: Prior successful Python runtime provenance run ID
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  sign-and-verify:
    name: OpenPGP-signed DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: linux-distribution
    env:
      BOTTIE_LINUX_ARTIFACT_DIRECTORY: package/linux
      BOTTIE_LINUX_EVIDENCE_PATH: package/linux-package-evidence.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux desktop and signature dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils \
            dbus-x11 \
            debsigs \
            debsig-verify \
            dpkg \
            gnupg \
            libasound2-dev \
            libspeechd-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xvfb

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify credential-free distribution contracts
        run: |
          npm run icons:check
          node --check scripts/linux-package.mjs
          node --check scripts/linux-distribution.mjs
          node --check scripts/linux-distribution-integration-contract.mjs
          node --check scripts/linux-distribution.integration.mjs
          node --check scripts/linux-shipping-python-containment.mjs
          node --check scripts/python-protected-package.mjs
          npm run package:linux:test
          npm test -- scripts/linux-distribution.test.mjs scripts/linux-shipping-python-containment.test.mjs \
            scripts/python-protected-package.test.mjs scripts/release-candidate.test.mjs
          npm run package:linux:distribution:test:integration

      - name: Build, inspect, and smoke-test unsigned product bytes
        if: inputs.python_provenance_run_id == ''
        run: dbus-run-session -- xvfb-run --auto-servernum npm run package:linux:smoke

      - name: Validate the selected Python provenance run
        if: inputs.python_provenance_run_id != ''
        env:
          BOTTIE_PYTHON_PROVENANCE_RUN_ID: ${{ inputs.python_provenance_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$BOTTIE_PYTHON_PROVENANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The Python provenance run ID must be a positive integer." >&2
            exit 1
          fi
          run_record="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOTTIE_PYTHON_PROVENANCE_RUN_ID"
          )"
          if ! jq -e --arg source "$GITHUB_SHA" \
            '.name == "Python runtime provenance" and .head_sha == $source and .conclusion == "success"' \
            <<<"$run_record" >/dev/null; then
            echo "The selected run is not successful Python provenance for this exact source revision." >&2
            exit 1
          fi

      - name: Download the accepted Python runtime
        if: inputs.python_provenance_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottie-python-runtime-provenance
          path: package/python-provenance
          run-id: ${{ inputs.python_provenance_run_id }}
          github-token: ${{ github.token }}

      - name: Download the accepted Python candidate
        if: inputs.python_provenance_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottie-python-release-candidate-evidence
          path: package/python-protected-input
          run-id: ${{ inputs.python_provenance_run_id }}
          github-token: ${{ github.token }}

      - name: Recreate and inspect the protected Python DEB
        if: inputs.python_provenance_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path python-runner/Cargo.toml --release --locked
          target="$(rustc --print host-tuple)"
          node scripts/python-runtime-bundle.mjs \
            --prepare "$target" package/python-provenance/runtime \
            python-runner/target/release/bottie-python-runner package/python-development
          dbus-run-session -- xvfb-run --auto-servernum npm run package:linux:smoke:python
          mapfile -t installers < <(find package/linux -maxdepth 1 -type f -name '*.deb')
          test "${#installers[@]}" -eq 1
          extracted="$RUNNER_TEMP/bottie-python-protected-deb"
          mkdir -p "$extracted" package/python-protected-evidence
          dpkg-deb --extract "${installers[0]}" "$extracted"
          node scripts/python-runtime-bundle.mjs --inspect-package linux "$extracted" \
            > package/python-protected-evidence/linux-unsigned-raw.json
          npm run --silent python:protected:inspect -- \
            "$GITHUB_SHA" linux package/python-protected-input/python-release-candidate-evidence.json \
            package/python-protected-evidence/linux-unsigned-raw.json \
            package/python-protected-evidence/linux-unsigned.json
          rm package/python-protected-evidence/linux-unsigned-raw.json

      - name: Prepare protected Linux signing material
        shell: bash
        env:
          BOTTIE_LINUX_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.BOTTIE_LINUX_SIGNING_PRIVATE_KEY_BASE64 }}
          BOTTIE_LINUX_SIGNING_KEY_PASSPHRASE: ${{ secrets.BOTTIE_LINUX_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          signing_root="$RUNNER_TEMP/bottie-linux-signing"
          gnupg_home="$signing_root/gnupg"
          verification_gnupg_home="$signing_root/verification-gnupg"
          private_key_path="$signing_root/private-key.asc"
          passphrase_path="$signing_root/passphrase"
          wrapper_directory="$signing_root/bin"
          canonical_payload_path="$signing_root/canonical-deb-payload"
          debsigs_payload_path="$signing_root/debsigs-payload"
          embedded_signature_path="$signing_root/embedded-origin-signature"
          public_key_source="$GITHUB_WORKSPACE/distribution/linux/bottie-linux-signing-public.asc"
          policy_source="$GITHUB_WORKSPACE/distribution/linux/bottie.pol"
          mkdir -p "$gnupg_home" "$verification_gnupg_home" "$wrapper_directory"
          chmod 700 "$signing_root" "$gnupg_home" "$verification_gnupg_home" "$wrapper_directory"
          test -n "$BOTTIE_LINUX_SIGNING_PRIVATE_KEY_BASE64"
          test -n "$BOTTIE_LINUX_SIGNING_KEY_PASSPHRASE"
          printf '%s' "$BOTTIE_LINUX_SIGNING_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key_path"
          printf '%s' "$BOTTIE_LINUX_SIGNING_KEY_PASSPHRASE" > "$passphrase_path"
          chmod 600 "$private_key_path" "$passphrase_path"
          if ! /usr/bin/gpg --batch --homedir "$gnupg_home" --pinentry-mode loopback \
            --passphrase-file "$passphrase_path" --import "$private_key_path" >/dev/null 2>&1; then
            echo "Protected Linux signing key import failed." >&2
            exit 1
          fi
          fingerprint="$(/usr/bin/gpg --batch --homedir "$gnupg_home" --with-colons --list-secret-keys 2>/dev/null | \
            awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }')"
          test "${#fingerprint}" -eq 40
          key_id="${fingerprint: -16}"
          policies_directory="$signing_root/policies"
          keyrings_directory="$signing_root/keyrings"
          signing_probe_path="$signing_root/signing-probe"
          signature_probe_path="$signing_root/signing-probe.sig"
          echo "::add-mask::$fingerprint"
          echo "::add-mask::$key_id"
          for protected_value in \
            "$signing_root" \
            "$gnupg_home" \
            "$verification_gnupg_home" \
            "$private_key_path" \
            "$passphrase_path" \
            "$wrapper_directory" \
            "$canonical_payload_path" \
            "$debsigs_payload_path" \
            "$embedded_signature_path" \
            "$policies_directory" \
            "$keyrings_directory" \
            "$signing_probe_path" \
            "$signature_probe_path"; do
            echo "::add-mask::$protected_value"
          done
          printf '%s\n' "bottie-linux-signing-probe-v1" > "$signing_probe_path"
          if ! /usr/bin/gpg --batch --homedir "$gnupg_home" --pinentry-mode loopback \
            --passphrase-file "$passphrase_path" --local-user "$fingerprint" \
            --output "$signature_probe_path" --detach-sign "$signing_probe_path" >/dev/null 2>&1; then
            echo "Protected Linux signing key cannot create a signature." >&2
            exit 1
          fi
          test -s "$signature_probe_path"
          public_fingerprint="$(/usr/bin/gpg --batch --homedir "$gnupg_home" --with-colons \
            --show-keys "$public_key_source" 2>/dev/null | \
            awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }')"
          if test "$public_fingerprint" != "$fingerprint"; then
            echo "Protected Linux signing key does not match the published public key." >&2
            exit 1
          fi
          mkdir -p "$policies_directory/$fingerprint" "$keyrings_directory/$fingerprint"
          public_keyring_path="$keyrings_directory/$fingerprint/bottie.gpg"
          /usr/bin/gpg --batch --yes --output "$public_keyring_path" --dearmor "$public_key_source"
          test -s "$public_keyring_path"
          if ! GNUPGHOME="$verification_gnupg_home" /usr/bin/gpg \
            --no-options --no-default-keyring --batch \
            --no-secmem-warning --no-permission-warning --no-mdc-warning --no-auto-check-trustdb \
            --weak-digest RIPEMD160 --weak-digest SHA1 \
            --keyring "$public_keyring_path" --verify "$signature_probe_path" "$signing_probe_path" \
            >/dev/null 2>&1; then
            echo "Published Linux public keyring cannot verify protected signatures." >&2
            exit 1
          fi
          policy_path="$policies_directory/$fingerprint/bottie.pol"
          install -m 600 "$policy_source" "$policy_path"
          test "$(grep -Fc "$fingerprint" "$policy_path")" -eq 3
          install -m 700 scripts/linux-debsigs-gpg-wrapper.sh "$wrapper_directory/gpg"
          {
            echo "BOTTIE_LINUX_SIGNING_KEY_ID=$key_id"
            echo "BOTTIE_LINUX_SIGNING_KEYRINGS_DIR=$keyrings_directory"
            echo "BOTTIE_LINUX_SIGNING_PAYLOAD_PATH=$canonical_payload_path"
            echo "BOTTIE_LINUX_SIGNING_PASSPHRASE_PATH=$passphrase_path"
            echo "BOTTIE_LINUX_SIGNING_POLICIES_DIR=$policies_directory"
            echo "BOTTIE_LINUX_SIGNING_PUBLIC_KEYRING_PATH=$public_keyring_path"
            echo "BOTTIE_LINUX_VERIFICATION_GNUPG_HOME=$verification_gnupg_home"
            echo "BOTTIE_LINUX_DEBSIGS_PAYLOAD_PATH=$debsigs_payload_path"
            echo "BOTTIE_LINUX_EMBEDDED_SIGNATURE_PATH=$embedded_signature_path"
            echo "GNUPGHOME=$gnupg_home"
          } >> "$GITHUB_ENV"
          echo "$wrapper_directory" >> "$GITHUB_PATH"

      - name: Sign and independently verify Linux distribution
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BOTTIE_UPDATER_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BOTTIE_UPDATER_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run package:linux:distribution

      - name: Remove protected Linux signing material
        if: always()
        shell: bash
        run: |
          if test -d "$RUNNER_TEMP/bottie-linux-signing/gnupg"; then
            /usr/bin/gpgconf --homedir "$RUNNER_TEMP/bottie-linux-signing/gnupg" --kill gpg-agent || true
          fi
          rm -rf "$RUNNER_TEMP/bottie-linux-signing"

      - name: Install and prove the protected Python DEB
        if: inputs.python_provenance_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find package/linux -maxdepth 1 -type f -name '*.deb')
          test "${#installers[@]}" -eq 1
          installer="$(realpath "${installers[0]}")"
          if dpkg-query --show --showformat='${Status}' bottie 2>/dev/null | grep -q 'install ok installed'; then
            echo "The protected Linux runner already has Bottie installed." >&2
            exit 1
          fi
          touch "$RUNNER_TEMP/bottie-python-protected-installed"
          sudo apt-get install --yes "$installer"
          npm run --silent python:protected:linux:prove-shipping -- \
            "$GITHUB_SHA" "$installer" package/python-protected-input/python-release-candidate-evidence.json \
            package/python-protected-evidence/linux-signed.json \
            package/python-protected-evidence/linux-containment.json
          cmp package/python-protected-evidence/linux-unsigned.json \
            package/python-protected-evidence/linux-signed.json
          npm run --silent python:protected:compare -- \
            "$GITHUB_SHA" linux package/python-protected-input/python-release-candidate-evidence.json \
            package/python-protected-evidence/linux-signed.json \
            package/python-protected-evidence/linux-containment.json \
            package/python-protected-evidence/linux-accepted.json

      - name: Upload identity-free evidence
        uses: actions/upload-artifact@v7
        with:
          name: bottie-linux-distribution-evidence
          path: package/linux-package-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload short-lived updater release bytes
        uses: actions/upload-artifact@v7
        with:
          name: bottie-updater-linux
          path: package/updater-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload identity-free protected Python evidence
        if: inputs.python_provenance_run_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: bottie-python-linux-protected-distribution-evidence
          path: |
            package/python-protected-evidence/linux-signed.json
            package/python-protected-evidence/linux-containment.json
            package/python-protected-evidence/linux-accepted.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the accepted protected Python comparison
        if: inputs.python_provenance_run_id != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bottie-python-linux-protected-comparison
          path: package/python-protected-evidence/linux-accepted.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove installed protected Python package
        if: always() && inputs.python_provenance_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/bottie-python-protected-installed"; then
            if dpkg-query --show --showformat='${Status}' bottie 2>/dev/null | grep -q 'install ok installed'; then
              sudo apt-get remove --yes bottie
            fi
            rm -f "$RUNNER_TEMP/bottie-python-protected-installed"
          fi

      - name: Remove protected Linux package bytes
        if: always()
        shell: bash
        run: |
          rm -rf package/linux
          rm -rf package/updater-artifacts
          rm -rf package/python-development package/python-protected-evidence package/python-protected-input
          rm -rf package/python-provenance
