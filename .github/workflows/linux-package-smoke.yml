name: Linux packaging smoke

on:
  pull_request:
    paths:
      - ".github/workflows/linux-package-smoke.yml"
      - ".github/workflows/linux-distribution-validation.yml"
      - "package-lock.json"
      - "package.json"
      - "assets/bottie-logo-kit/**"
      - "scripts/application-icons.mjs"
      - "scripts/application-icons.test.mjs"
      - "scripts/linux-debsigs-gpg-wrapper.sh"
      - "scripts/linux-distribution-integration-contract.mjs"
      - "scripts/linux-distribution.integration.mjs"
      - "scripts/linux-distribution.mjs"
      - "scripts/linux-distribution.test.mjs"
      - "scripts/linux-package.contract.mjs"
      - "scripts/linux-package.mjs"
      - "distribution/linux/**"
      - "src/**"
      - "src-tauri/**"
      - "static/**"
      - "svelte.config.js"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-smoke:
    name: Locked DEB and isolated smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BOTTIE_LINUX_ARTIFACT_DIRECTORY: package/linux
      BOTTIE_LINUX_EVIDENCE_PATH: package/linux-package-evidence.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils \
            dbus-x11 \
            debsigs \
            debsig-verify \
            dpkg \
            gnupg \
            libasound2-dev \
            libspeechd-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xvfb

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify Linux package contracts
        run: |
          npm run icons:check
          node --check scripts/linux-package.mjs
          node --check scripts/linux-package.contract.mjs
          node --check scripts/linux-distribution.mjs
          node --check scripts/linux-distribution-integration-contract.mjs
          node --check scripts/linux-distribution.integration.mjs
          npm run package:linux:test
          npm test -- scripts/linux-distribution.test.mjs
          npm run package:linux:distribution:test:integration

      - name: Build, inspect, and smoke-test unsigned DEB
        run: dbus-run-session -- xvfb-run --auto-servernum npm run package:linux:smoke

      - name: Upload bounded package evidence
        uses: actions/upload-artifact@v7
        with:
          name: bottie-linux-package-smoke
          path: |
            package/linux-package-evidence.json
            package/linux/*.deb
          if-no-files-found: error
          retention-days: 7
