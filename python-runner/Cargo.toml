[package]
name = "bottie-python-runner"
version = "0.1.0"
description = "Isolated CPython/WASI execution helper for Bottie."
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wasmtime = { version = "=45.0.3", default-features = false, features = [
  "anyhow",
  "cranelift",
  "pulley",
  "runtime",
  "std",
] }
wasmtime-wasi = { version = "=45.0.3", default-features = false, features = ["p1"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
